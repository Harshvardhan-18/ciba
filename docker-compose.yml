version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ciba
      POSTGRES_PASSWORD: ciba_dev
      POSTGRES_DB: ciba_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciba -d ciba_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
